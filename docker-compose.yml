services:
  link2obsidian:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: link2obsidian:local
    container_name: link2obsidian
    restart: unless-stopped
    environment:
      L2O_HOST: 0.0.0.0
      L2O_PORT: 8080
      L2O_LOG_LEVEL: "${L2O_LOG_LEVEL:-info}"
      L2O_API_TOKEN: "${L2O_API_TOKEN:-change-me}"
      L2O_VAULT_PATH: /vault
      L2O_OUTPUT_DIR: "${L2O_OUTPUT_DIR:-Clippings}"
      L2O_ATTACHMENTS_DIR: "${L2O_ATTACHMENTS_DIR:-Attachments}"
      L2O_DATA_PATH: /app/data
      L2O_TMP_PATH: /app/tmp
      L2O_PLUGINS_PATH: /app/plugins
      L2O_TIMEZONE: "${L2O_TIMEZONE:-Asia/Shanghai}"
      L2O_LANGUAGE: "${L2O_LANGUAGE:-zh-CN}"
      L2O_WORKER_CONCURRENCY: "${L2O_WORKER_CONCURRENCY:-1}"
      L2O_PAGE_TIMEOUT_MS: "${L2O_PAGE_TIMEOUT_MS:-30000}"
      L2O_IMAGE_TIMEOUT_MS: "${L2O_IMAGE_TIMEOUT_MS:-15000}"
      L2O_MAX_IMAGES: "${L2O_MAX_IMAGES:-100}"
      L2O_MAX_IMAGE_BYTES: "${L2O_MAX_IMAGE_BYTES:-20971520}"
      L2O_DUPLICATE_POLICY: "${L2O_DUPLICATE_POLICY:-skip}"
      L2O_DEFAULT_CATEGORY: "${L2O_DEFAULT_CATEGORY:-生活经验}"
      L2O_AI_ENABLED: "${L2O_AI_ENABLED:-false}"
      L2O_AI_PROVIDER: "${L2O_AI_PROVIDER:-ollama}"
      L2O_AI_BASE_URL: "${L2O_AI_BASE_URL:-http://host.docker.internal:11434}"
      L2O_AI_MODEL: "${L2O_AI_MODEL:-qwen3:8b}"
      L2O_AI_API_KEY: "${L2O_AI_API_KEY:-}"
      L2O_AI_TIMEOUT_MS: "${L2O_AI_TIMEOUT_MS:-60000}"
      L2O_AI_MAX_CONTENT_CHARS: "${L2O_AI_MAX_CONTENT_CHARS:-12000}"
    ports:
      - "${L2O_PORT:-8080}:8080"
    volumes:
      - "${L2O_VAULT_HOST_PATH:-./vault}:/vault"
      - "${L2O_DATA_HOST_PATH:-./data}:/app/data"
      - "${L2O_TMP_HOST_PATH:-./tmp}:/app/tmp"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
