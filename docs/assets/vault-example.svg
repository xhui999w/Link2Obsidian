    <text x="52" y="366">▾ 📁 Attachments</text>
    <text x="78" y="406">▾ 📁 改善睡眠--a1b2c3d4e5</text>
    <text x="104" y="446">🖼 image001.jpg</text>
    <text x="104" y="486">🖼 image002.png</text>
  </g>
  <text x="462" y="104" fill="#312e81" font-family="system-ui, sans-serif" font-size="28" font-weight="700">改善睡眠的方法</text>
  <line x1="462" y1="122" x2="1156" y2="122" stroke="#cbd5e1"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="462" y="164" fill="#64748b">---</text>
