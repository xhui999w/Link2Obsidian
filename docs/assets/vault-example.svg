  <rect x="0" y="58" width="420" height="622" fill="#eef2ff"/>
  <line x1="420" y1="58" x2="420" y2="680" stroke="#c7d2fe" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="21" fill="#1e1b4b">
    <text x="28" y="104" font-weight="700">MyVault</text>
